<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrativo</title>
    <style>
        /* Estilos generales adaptados para móviles y PC */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
        .container { width: 100%; max-width: 400px; background: #ffffff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; margin-bottom: 20px; color: #333; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #666; font-size: 14px; }
        input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
        button { width: 100%; padding: 12px; background: #007bff; border: none; border-radius: 4px; color: white; font-size: 16px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .error { color: red; font-size: 14px; text-align: center; margin-top: 10px; }
        
        /* Panel Oculto por defecto */
        #admin-panel { display: none; }
        .admin-dashboard { width: 100%; max-width: 800px; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        
        /* Media Queries adicionales para asegurar adaptación móvil fluida */
        @media (max-width: 480px) {
            .container, .admin-dashboard { padding: 15px; }
            input, button { font-size: 14px; padding: 10px; }
        }
    </style>
</head>
<body>

    <!-- Formulario de Login -->
    <div class="container" id="login-container">
        <h2>Acceso Admin</h2>
        <div class="form-group">
            <label for="email">Correo Electrónico:</label>
            <input type="email5" id="email" placeholder="admin@tudominio.com" required>
        </div>
        <div class="form-group">
            <label for="password">Contraseña:</label>
            <input type="password" id="password" placeholder="********" required>
        </div>
        <button onclick="verificarLogin()">Entrar</button>
        <div id="error-msg" class="error"></div>
    </div>

    <!-- Panel de Administración (Visible tras login exitoso) -->
    <div class="admin-dashboard" id="admin-panel">
        <h2>Panel de Control</h2>
        <p>Bienvenido al sistema administrativo.</p>
        <!-- Agrega aquí tus herramientas, tablas o controles -->
        <button onclick="cerrarSesion()" style="background: #dc3545; margin-top: 20px;">Cerrar Sesión</button>
    </div>

    <script>
        function verificarLogin() {
            const emailInput = document.getElementById('email').value.trim();
            const passwordInput = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('error-msg');

            // Credenciales de ejemplo (reemplaza con tu lógica de backend o base de datos)
            const adminEmail = "admin@admin.com";
            const adminPass = "123456";

            if (emailInput === adminEmail && passwordInput === adminPass) {
                // Ocultar login y mostrar panel móvil
                document.getElementById('login-container').style.display = 'none';
                document.getElementById('admin-panel').style.display = 'block';
                errorMsg.textContent = "";
            } else {
                errorMsg.textContent = "Correo o contraseña incorrectos.";
            }
        }

        function cerrarSesion() {
            document.getElementById('admin-panel').style.display = 'none';
            document.getElementById('login-container').style.display = 'block';
            document.getElementById('email').value = '';
            document.getElementById('password').value = '';
        }
    </script>
</body>
</html>
